<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITE - Annuaire des Restaurants</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #000000, #0f172a, #1e3a8a, #090d16, #000000);
            background-size: 400% 400%;
            animation: waveBackground 12s ease infinite;
            margin: 0; 
            padding: 30px 15px; 
            direction: ltr; 
            color: #f8fafc;
            min-height: 100vh;
        }

        @keyframes waveBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { 
            max-width: 1200px; 
            margin: auto; 
        }

        .site-title {
            text-align: center;
            color: #ffffff;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-shadow: 0 4px 15px rgba(37, 99, 235, 0.5);
            text-transform: uppercase;
        }

        .search-box-wrapper {
            max-width: 500px;
            margin: 0 auto 35px auto;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .search-box-wrapper input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
            background: transparent;
            text-align: left;
            color: #ffffff;
        }
        .search-box-wrapper input::placeholder {
            color: #94a3b8;
        }

        /* شبكة الكاردات: 4 مطاعم في السطر */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 992px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 576px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        .restaurant-card { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(12px);
            padding: 20px; 
            border-radius: 16px; 
            cursor: pointer; 
            text-align: center; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border-color: rgba(59, 130, 246, 0.6);
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
            margin-bottom: 12px;
        }

        .restaurant-info h3 {
            margin: 0 0 5px 0;
            font-size: 17px;
            color: #ffffff;
        }
        .restaurant-info p {
            margin: 0;
            font-size: 13px;
            color: #94a3b8;
        }

        /* تصميم النافذة الكبيرة المنبثقة في وسط الشاشة (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(59, 130, 246, 0.4);
            max-width: 600px;
            width: 100%;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 20px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .close-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .modal-title {
            font-size: 24px;
            color: #ffffff;
            margin: 0 0 15px 0;
        }

        .modal-menu-img {
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 400px;
            object-fit: contain;
            background: #000;
        }

        .modal-phone-btn {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 5px 20px rgba(37, 99, 235, 0.5);
            transition: opacity 0.2s;
        }
        .modal-phone-btn:hover { opacity: 0.9; }

        .no-result { 
            text-align: center; 
            color: #94a3b8; 
            font-size: 15px; 
            margin-top: 30px; 
            font-weight: 500;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="site-title">BITE</div>

    <!-- صندوق البحث -->
    <div class="search-box-wrapper">
        <span style="margin-left: 10px; font-size: 18px;">🔍</span>
        <input type="text" id="wilayaInput" placeholder="Entrez votre Wilaya (ex: Constantine)..." oninput="searchRestaurants()">
    </div>

    <!-- شبكة نتائج البحث -->
    <div id="resultsContainer" class="grid-container"></div>
</div>

<!-- النافذة المنبثقة الكبيرة في المنتصف (Modal) -->
<div id="restaurantModal" class="modal-overlay" onclick="closeModalOnOutside(event)">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">×</button>
        <h2 id="modalName" class="modal-title"></h2>
        <img id="modalMenuImg" src="" alt="Menu" class="modal-menu-img">
        <a id="modalPhoneBtn" href="" class="modal-phone-btn">📞 Appeler pour commander</a>
    </div>
</div>

<script>
    // قاعدة بيانات تجريبية لـ 8 مطاعم في قسنطينة
    const database = [
        {
            "name": "Le Gourmet Constantine",
            "wilaya": "Constantine",
            "phone": "0600112233",
            "profileImg": "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=200",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Fast Food El Gusto",
            "wilaya": "Constantine",
            "phone": "0611223344",
            "profileImg": "https://images.unsplash.com/photo-1543007630-9710e4a00a20?w=200",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Pizzeria Roma",
            "wilaya": "Constantine",
            "phone": "0622334455",
            "profileImg": "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=200",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Tacos King",
            "wilaya": "Constantine",
            "phone": "0633445566",
            "profileImg": "https://images.unsplash.com/photo-1550547660-d9450f859349?w=200",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Grillades du Rocher",
            "wilaya": "Constantine",
            "phone": "0644556677",
            "profileImg": "https://images.unsplash.com/photo-1544025162-d76694265947?w=200",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Chawarma El Emir",
            "wilaya": "Constantine",
            "phone": "0655667788",
            "profileImg": "https://images.unsplash.com/photo-1561758033-d89a9ad46330?w=200",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Restaurant Cirta",
            "wilaya": "Constantine",
            "phone": "0666778899",
            "profileImg": "https://images.unsplash.com/photo-1537047902294-62a40c20a6ae?w=200",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Sandwicherie Express",
            "wilaya": "Constantine",
            "phone": "0677889900",
            "profileImg": "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=200",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        }
    ];

    function searchRestaurants() {
        let query = document.getElementById("wilayaInput").value.trim().toLowerCase();
        let container = document.getElementById("resultsContainer");
        container.innerHTML = "";

        if (query === "") {
            return;
        }

        let filtered = database.filter(r => r.wilaya.toLowerCase().includes(query));

        if (filtered.length === 0) {
            container.innerHTML = "<p class='no-result'>Aucun restaurant trouvé pour cette wilaya.</p>";
            return;
        }

        filtered.forEach((rest) => {
            let card = document.createElement("div");
            card.className = "restaurant-card";
            
            card.innerHTML = `
                <img src="${rest.profileImg}" alt="${rest.name}" class="profile-img">
                <div class="restaurant-info">
                    <h3>${rest.name}</h3>
                    <p>📍 ${rest.wilaya}</p>
                </div>
            `;
            
            // عند الضغط على الكارد، تفتح النافذة الكبيرة في الوسط
            card.onclick = function() {
                openModal(rest);
            };

            container.appendChild(card);
        });
    }

    function openModal(rest) {
        document.getElementById("modalName").innerText = rest.name;
        document.getElementById("modalMenuImg").src = rest.menuImage;
        let phoneBtn = document.getElementById("modalPhoneBtn");
        phoneBtn.href = "tel:" + rest.phone;
        phoneBtn.innerText = "📞 Appeler pour commander : " + rest.phone;

        document.getElementById("restaurantModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("restaurantModal").style.display = "none";
    }

    function closeModalOnOutside(event) {
        let modalContent = document.querySelector(".modal-content");
        // إذا ضغط المستخدم خارج الصندوق الأسود، تُغلق النافذة
        if (!modalContent.contains(event.target)) {
            closeModal();
        }
    }
</script>

</body>
</html>
