<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITE - Annuaire des Restaurants</title>
    
    <!-- كود الإعلان الأول (في الـ Head) -->
    <script src="https://quge5.com/88/tag.min.js" data-zone="267550" async data-cfasync="false"></script>

    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #000000, #0f172a, #1e3a8a, #090d16, #000000);
            background-size: 400% 400%;
            animation: waveBackground 12s ease infinite;
            margin: 0; 
            padding: 30px 15px; 
            direction: ltr; 
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes waveBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 5. خلفية الجسيمات المضيئة (Particles) */
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .particle { position: absolute; background: #ffffff; border-radius: 50%; opacity: 0.2; animation: floatParticle linear infinite; }
        @keyframes floatParticle { 0% { transform: translateY(100vh) scale(0); } 50% { opacity: 0.5; } 100% { transform: translateY(-50px) scale(1); opacity: 0; } }

        /* 2. شريط التحميل العلوي العصري */
        #loader { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #3b82f6, #ec4899); width: 0%; transition: width 0.4s ease-in-out; z-index: 9999; }

        .container { 
            max-width: 650px; 
            margin: auto; 
        }

        .site-title {
            text-align: center;
            color: #ffffff;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-shadow: 0 4px 15px rgba(37, 99, 235, 0.5);
            text-transform: uppercase;
        }

        .search-box-wrapper {
            width: 100%;
            margin: 0 auto 35px auto;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .search-box-wrapper input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 18px;
            background: transparent;
            text-align: left;
            color: #ffffff;
        }
        .search-box-wrapper input::placeholder {
            color: #94a3b8;
        }

        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* 4. حواف البطاقات المتدرجة والمتحركة عند مرور الماوس */
        .restaurant-card { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(12px);
            padding: 24px; 
            border-radius: 20px; 
            cursor: pointer; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(59, 130, 246, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
        }
        .restaurant-card::before {
            content: "";
            position: absolute;
            inset: -2px;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0%, #3b82f6 50%, transparent 100%);
            border-radius: 22px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
            animation: rotateBorder 4s linear infinite;
        }
        .restaurant-card:hover::before { opacity: 1; }
        @keyframes rotateBorder { 100% { transform: rotate(360deg); } }

        .profile-img {
            width: 100%;
            height: 240px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid rgba(59, 130, 246, 0.3);
            margin-bottom: 18px;
        }

        .restaurant-info h3 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: #ffffff;
        }
        .restaurant-info p {
            margin: 0;
            font-size: 16px;
            color: #94a3b8;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(59, 130, 246, 0.4);
            max-width: 650px;
            width: 100%;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 20px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .close-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .modal-title {
            font-size: 26px;
            color: #ffffff;
            margin: 0 0 15px 0;
        }

        .modal-menu-img {
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 450px;
            object-fit: contain;
            background: #000;
        }

        .modal-phone-btn {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 5px 20px rgba(37, 99, 235, 0.5);
            transition: opacity 0.2s, transform 0.2s;
        }
        .modal-phone-btn:hover { opacity: 0.9; transform: scale(1.02); }

        .no-result { 
            text-align: center; 
            color: #94a3b8; 
            font-size: 16px; 
            margin-top: 30px; 
            font-weight: 500;
        }
    </style>
</head>
<body>

<!-- شريط التحميل العلوي المتحرك -->
<div id="loader"></div>

<!-- خلفية الجسيمات المضيئة -->
<div id="particles-js"></div>

<div class="container">
    <div class="site-title">BITE</div>

    <!-- خانة البحث (مع إشهار عند النقر) -->
    <div class="search-box-wrapper">
        <span style="margin-left: 10px; font-size: 20px;">🔍</span>
        <input type="text" id="wilayaInput" placeholder="Entrez votre Wilaya (ex: Constantine)..." oninput="searchRestaurants()" onclick="triggerAd()">
    </div>

    <!-- نتائج البحث -->
    <div id="resultsContainer" class="grid-container"></div>
</div>

<!-- النافذة المنبثقة للمينيو واتصال المطعم -->
<div id="restaurantModal" class="modal-overlay" onclick="closeModalOnOutside(event)">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">×</button>
        <h2 id="modalName" class="modal-title"></h2>
        <img id="modalMenuImg" src="" alt="Menu" class="modal-menu-img">
        <a id="modalPhoneBtn" href="" class="modal-phone-btn">📞 Appeler pour commander</a>
    </div>
</div>

<script>
    // تشغيل جسيمات الخلفية (فكرة 5)
    function createParticles() {
        const container = document.getElementById("particles-js");
        for (let i = 0; i < 25; i++) {
            let p = document.createElement("div");
            p.className = "particle";
            p.style.left = Math.random() * 100 + "%";
            p.style.width = p.style.height = (Math.random() * 4 + 2) + "px";
            p.style.animationDuration = (Math.random() * 6 + 6) + "s";
            p.style.animationDelay = (Math.random() * 5) + "s";
            container.appendChild(p);
        }
    }
    createParticles();

    // دالة تشغيل الإعلان الثاني
    function triggerAd() {
        try {
            (function(s){
                s.dataset.zone='11517801';
                s.src='https://n6wxm.com/vignette.min.js';
                [document.documentElement, document.body].filter(Boolean).pop().appendChild(s);
            })(document.createElement('script'));
        } catch(e) {}
    }

    // قاعدة بيانات المطاعم الكاملة
    const database = [
        {
            "name": "Le Gourmet Constantine",
            "wilaya": "Constantine",
            "phone": "0600112233",
            "profileImg": "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=700",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Fast Food El Gusto",
            "wilaya": "Constantine",
            "phone": "0611223344",
            "profileImg": "https://images.unsplash.com/photo-1543007630-9710e4a00a20?w=700",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Pizzeria Roma",
            "wilaya": "Constantine",
            "phone": "0622334455",
            "profileImg": "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=700",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Tacos King",
            "wilaya": "Constantine",
            "phone": "0633445566",
            "profileImg": "https://images.unsplash.com/photo-1550547660-d9450f859349?w=700",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Grillades du Rocher",
            "wilaya": "Constantine",
            "phone": "0644556677",
            "profileImg": "https://images.unsplash.com/photo-1544025162-d76694265947?w=700",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Chawarma El Emir",
            "wilaya": "Constantine",
            "phone": "0655667788",
            "profileImg": "https://images.unsplash.com/photo-1561758033-d89a9ad46330?w=700",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Restaurant Cirta",
            "wilaya": "Constantine",
            "phone": "0666778899",
            "profileImg": "https://images.unsplash.com/photo-1537047902294-62a40c20a6ae?w=700",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        },
        {
            "name": "Sandwicherie Express",
            "wilaya": "Constantine",
            "phone": "0677889900",
            "profileImg": "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=700",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        }
    ];

    function searchRestaurants() {
        // تأثير شريط التحميل (فكرة 2)
        let loader = document.getElementById("loader");
        loader.style.width = "100%";
        setTimeout(() => { loader.style.width = "0%"; }, 400);

        let query = document.getElementById("wilayaInput").value.trim().toLowerCase();
        let container = document.getElementById("resultsContainer");
        container.innerHTML = "";

        if (query === "") {
            return;
        }

        let filtered = database.filter(r => r.wilaya.toLowerCase().includes(query));

        if (filtered.length === 0) {
            container.innerHTML = "<p class='no-result'>Aucun restaurant trouvé pour cette wilaya.</p>";
            return;
        }

        filtered.forEach((rest) => {
            let card = document.createElement("div");
            card.className = "restaurant-card";
            
            card.innerHTML = `
                <img src="${rest.profileImg}" alt="${rest.name}" class="profile-img">
                <div class="restaurant-info">
                    <h3>${rest.name}</h3>
                    <p>📍 ${rest.wilaya}</p>
                </div>
            `;
            
            // عند النقر على المطعم: يشغل الإعلان + يفتح المينيو بوضوح
            card.onclick = function() {
                triggerAd();
                openModal(rest);
            };

            container.appendChild(card);
        });
    }

    function openModal(rest) {
        document.getElementById("modalName").innerText = rest.name;
        document.getElementById("modalMenuImg").src = rest.menuImage;
        let phoneBtn = document.getElementById("modalPhoneBtn");
        phoneBtn.href = "tel:" + rest.phone;
        phoneBtn.innerText = "📞 Appeler pour commander : " + rest.phone;

        document.getElementById("restaurantModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("restaurantModal").style.display = "none";
    }

    function closeModalOnOutside(event) {
        let modalContent = document.querySelector(".modal-content");
        if (!modalContent.contains(event.target)) {
            closeModal();
        }
    }
</script>

</body>
</html>
