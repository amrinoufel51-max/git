<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITE - Annuaire des Restaurants</title>

    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #000000, #0f172a, #1e3a8a, #090d16, #000000);
            background-size: 400% 400%;
            animation: waveBackground 12s ease infinite;
            margin: 0; 
            padding: 30px 15px; 
            direction: ltr; 
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #000000, #0f172a, #1e3a8a, #090d16, #000000);
            background-size: 400% 400%;
            animation: waveBackground 12s ease infinite;
            z-index: -2;
        }

        @keyframes waveBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .particle { position: absolute; background: #ffffff; border-radius: 50%; opacity: 0.2; animation: floatParticle linear infinite; }
        @keyframes floatParticle { 0% { transform: translateY(100vh) scale(0); } 50% { opacity: 0.5; } 100% { transform: translateY(-50px) scale(1); opacity: 0; } }

        #loader { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #3b82f6, #ec4899); width: 0%; transition: width 0.3s ease-in-out; z-index: 9999; }

        .container { 
            max-width: 650px; 
            margin: auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .title-wrapper { position: relative; margin-bottom: 25px; text-align: center; }

        .site-title {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .site-title span {
            display: inline-block;
            opacity: 0;
            transform: scale(1.8) translateY(60px);
            animation: popAndSettle 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            background: linear-gradient(to right, #fff, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
        }

        .site-title span:nth-child(1) { animation-delay: 0.1s; }
        .site-title span:nth-child(2) { animation-delay: 0.2s; }
        .site-title span:nth-child(3) { animation-delay: 0.3s; }
        .site-title span:nth-child(4) { animation-delay: 0.4s; }

        @keyframes popAndSettle {
            0% { opacity: 0; transform: scale(1.8) translateY(80px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .search-box-wrapper {
            width: 100%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            border: 1px solid rgba(59, 130, 246, 0.3);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInSearch 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
        }

        @keyframes fadeInSearch { to { opacity: 1; transform: translateY(0); } }

        .search-box-wrapper input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 18px;
            background: transparent;
            text-align: left;
            color: #ffffff;
        }
        .search-box-wrapper input::placeholder { color: #94a3b8; }

        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            margin-top: 35px;
        }

        .restaurant-card { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(12px);
            padding: 24px; 
            border-radius: 20px; 
            cursor: pointer; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(59, 130, 246, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .restaurant-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
        }

        .profile-img {
            width: 100%;
            height: 240px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid rgba(59, 130, 246, 0.3);
            margin-bottom: 18px;
        }

        .restaurant-info h3 { margin: 0 0 8px 0; font-size: 24px; color: #ffffff; }
        .restaurant-info p { margin: 0; font-size: 16px; color: #94a3b8; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center; align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(59, 130, 246, 0.4);
            max-width: 650px; width: 100%;
            border-radius: 20px; padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            text-align: center; position: relative;
            max-height: 95vh; overflow-y: auto;
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px;
            background: rgba(255, 255, 255, 0.1); border: none;
            color: white; font-size: 20px; width: 35px; height: 35px;
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }

        .modal-title { font-size: 26px; color: #ffffff; margin: 0 0 15px 0; }
        
        .slider-container {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
        }

        /* حاوية الصورة تتكيف كلياً وسلاسة مع أبعاد الصورة الحقيقية */
        .slider-image-wrapper {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: height 0.3s ease; /* سلاسة تامة عند تغيير المقاسات بين الصور */
        }

        .modal-menu-img {
            width: 100%;
            height: auto;
            max-height: 75vh;
            object-fit: contain;
            display: block;
            transition: opacity 0.3s ease;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 5;
        }
        .slider-btn:hover { background: rgba(59, 130, 246, 0.9); }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        .slider-counter {
            margin-top: 10px;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
        }

        .modal-phone-btn {
            display: block; text-align: center;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white; padding: 15px; border-radius: 12px;
            text-decoration: none; margin-top: 20px; font-weight: 700; font-size: 18px;
        }

        .no-result { text-align: center; color: #94a3b8; font-size: 16px; margin-top: 30px; font-weight: 500; }
    </style>
</head>
<body>

<div id="loader"></div>
<div id="particles-js"></div>

<div class="container" id="mainContainer">
    <div class="title-wrapper">
        <div class="site-title">
            <span>B</span><span>I</span><span>T</span><span>E</span>
        </div>
    </div>

    <div class="search-box-wrapper">
        <span style="margin-right: 10px; font-size: 20px;">🔍</span>
        <input type="text" id="wilayaInput" placeholder="Entrez votre Wilaya (ex: se, alger)..." oninput="searchRestaurants()">
    </div>

    <div id="resultsContainer" class="grid-container"></div>
</div>

<div id="restaurantModal" class="modal-overlay" onclick="closeModalOnOutside(event)">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">×</button>
        <h2 id="modalName" class="modal-title"></h2>
        
        <div class="slider-container" id="sliderContainerBox">
            <button class="slider-btn prev-btn" onclick="changeSlide(-1)">❮</button>
            <div class="slider-image-wrapper" id="sliderImageWrapper">
                <img id="modalMenuImg" class="modal-menu-img" src="" alt="Menu">
            </div>
            <button class="slider-btn next-btn" onclick="changeSlide(1)">❯</button>
        </div>
        <div id="sliderCounter" class="slider-counter"></div>

        <a id="modalPhoneBtn" href="" class="modal-phone-btn">📞 Appeler pour commander</a>
    </div>
</div>

<script>
    const wilayasList = [
        "adrar", "chlef", "laghouat", "oum_el_bouaghi", "batna", "bejaia", "biskra", "bechar", 
        "blida", "bouira", "tamanrasset", "tbessa", "tlemcen", "tiaret", "tizi_ouzou", "alger", 
        "djelfa", "jijel", "setif", "saida", "skikda", "sidi_bel_abbes", "annaba", "guelma", 
        "constantine", "medea", "mostaganem", "msila", "mascara", "ouargla", "oran", "el_bayadh", 
        "illizi", "bordj_bou_arreridj", "boumerdes", "el_tarf", "tindouf", "tissemsilt", "el_oued", 
        "khenchela", "souk_ahras", "tipaza", "mila", "ain_defla", "naama", "ain_temouchent", 
        "ghardaia", "relizane", "timimoun", "bordj_badji_mokhtar", "ouled_djellal", "beni_abbes", 
        "in_guezzam", "in_salah", "janet", "el_meghaier", "el_meniaa"
    ];

    let currentMenuImages = [];
    let currentImageIndex = 0;
    
    let allRestaurants = [];
    let displayedCount = 0;
    const batchSize = 10;

    function createParticles() {
        const container = document.getElementById("particles-js");
        for (let i = 0; i < 25; i++) {
            let p = document.createElement("div");
            p.className = "particle";
            p.style.left = Math.random() * 100 + "%";
            p.style.width = p.style.height = (Math.random() * 4 + 2) + "px";
            p.style.animationDuration = (Math.random() * 6 + 6) + "s";
            p.style.animationDelay = (Math.random() * 5) + "s";
            container.appendChild(p);
        }
    }
    createParticles();

    async function searchRestaurants() {
        let loader = document.getElementById("loader");
        loader.style.width = "100%";

        let query = document.getElementById("wilayaInput").value.trim().toLowerCase();
        let formattedQuery = query.replace(/\s+/g, "_");

        let container = document.getElementById("resultsContainer");
        let mainContainer = document.getElementById("mainContainer");
        
        container.innerHTML = "";
        allRestaurants = [];
        displayedCount = 0;

        if (query === "") {
            loader.style.width = "0%";
            mainContainer.style.justifyContent = "center";
            mainContainer.style.minHeight = "80vh";
            return;
        }

        mainContainer.style.justifyContent = "flex-start";
        mainContainer.style.minHeight = "unset";

        let matchedWilaya = wilayasList.find(w => w.startsWith(formattedQuery) || w.includes(formattedQuery));

        if (!matchedWilaya) {
            loader.style.width = "0%";
            container.innerHTML = "<p class='no-result'>Wilaya introuvable...</p>";
            return;
        }

        try {
            let response = await fetch(`${matchedWilaya}.json`);
            
            if (!response.ok) {
                loader.style.width = "0%";
                container.innerHTML = `<p class='no-result'>Aucun restaurant pour ${matchedWilaya.toUpperCase()} pour le moment.</p>`;
                return;
            }

            allRestaurants = await response.json();
            loader.style.width = "0%";

            renderMoreRestaurants(matchedWilaya);

        } catch (error) {
            loader.style.width = "0%";
            container.innerHTML = "<p class='no-result'>Erreur de chargement.</p>";
        }
    }

    function renderMoreRestaurants(wilayaName) {
        let container = document.getElementById("resultsContainer");
        let nextBatch = allRestaurants.slice(displayedCount, displayedCount + batchSize);

        nextBatch.forEach((rest) => {
            let card = document.createElement("div");
            card.className = "restaurant-card";
            
            card.innerHTML = `
                <img src="${rest.profileImg}" alt="${rest.name}" class="profile-img" loading="lazy">
                <div class="restaurant-info">
                    <h3>${rest.name}</h3>
                    <p>📍 ${wilayaName.toUpperCase()}</p>
                </div>
            `;
            
            card.onclick = function() {
                openModal(rest);
            };

            container.appendChild(card);
        });

        displayedCount += nextBatch.length;
    }

    window.addEventListener("scroll", () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
            let query = document.getElementById("wilayaInput").value.trim().toLowerCase();
            let formattedQuery = query.replace(/\s+/g, "_");
            let matchedWilaya = wilayasList.find(w => w.startsWith(formattedQuery) || w.includes(formattedQuery));
            
            if (matchedWilaya && displayedCount < allRestaurants.length) {
                renderMoreRestaurants(matchedWilaya);
            }
        }
    });

    function openModal(rest) {
        document.getElementById("modalName").innerText = rest.name;
        
        currentMenuImages = rest.menuImages || [];
        currentImageIndex = 0;

        let sliderBox = document.getElementById("sliderContainerBox");
        let counterBox = document.getElementById("sliderCounter");

        if (currentMenuImages.length > 0) {
            sliderBox.style.display = "flex";
            updateSliderImage();
        } else {
            sliderBox.style.display = "none";
            counterBox.innerText = "Aucun menu disponible";
        }

        let phoneBtn = document.getElementById("modalPhoneBtn");
        phoneBtn.href = "tel:" + rest.phone;
        phoneBtn.innerText = "📞 Appeler pour commander : " + rest.phone;

        document.getElementById("restaurantModal").style.display = "flex";
    }

    function updateSliderImage() {
        let imgElement = document.getElementById("modalMenuImg");
        let wrapperElement = document.getElementById("sliderImageWrapper");
        let counterElement = document.getElementById("sliderCounter");

        imgElement.src = currentMenuImages[currentImageIndex];
        counterElement.innerText = `Menu ${currentImageIndex + 1} / ${currentMenuImages.length}`;
        
        // حساب أبعاد الصورة تلقائياً بمجرد تحميلها لتطبيقها على الحاوية بدقة
        imgElement.onload = function() {
            let wrapperWidth = wrapperElement.clientWidth;
            // حساب الارتفاع النسبي للحاوية بناءً على العرض والطول الحقيقي للصورة
            let naturalRatio = imgElement.naturalHeight / imgElement.naturalWidth;
            let calculatedHeight = wrapperWidth * naturalRatio;

            // تحديد حدود قصوى لئلا تصبح الصورة طويلة جداً بشكل يخرج عن الشاشة
            let maxHeight = window.innerHeight * 0.75;
            if (calculatedHeight > maxHeight) {
                calculatedHeight = maxHeight;
            }
            if (calculatedHeight < 200) {
                calculatedHeight = 200;
            }

            wrapperElement.style.height = calculatedHeight + "px";
        };

        // في حال كانت الصورة مخزنة مسبقاً في الذاكرة المؤقتة للمتصفح
        if (imgElement.complete) {
            imgElement.onload();
        }

        let prevBtn = document.querySelector(".prev-btn");
        let nextBtn = document.querySelector(".next-btn");
        
        if (currentMenuImages.length <= 1) {
            prevBtn.style.display = "none";
            nextBtn.style.display = "none";
        } else {
            prevBtn.style.display = "flex";
            nextBtn.style.display = "flex";
        }
    }

    function changeSlide(direction) {
        if (currentMenuImages.length === 0) return;
        currentImageIndex += direction;

        if (currentImageIndex < 0) {
            currentImageIndex = currentMenuImages.length - 1;
        } else if (currentImageIndex >= currentMenuImages.length) {
            currentImageIndex = 0;
        }

        updateSliderImage();
    }

    function closeModal() {
        document.getElementById("restaurantModal").style.display = "none";
    }

    function closeModalOnOutside(event) {
        let modalContent = document.querySelector(".modal-content");
        if (!modalContent.contains(event.target)) {
            closeModal();
        }
    }
</script>

</body>
</html>
