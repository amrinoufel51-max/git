<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITE - Annuaire des Restaurants</title>
    <style>
        * { box-sizing: border-box; }
        
        /* خلفية عصرية متحركة بتموجات بين الأسود والأزرق الداكن */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #000000, #0f172a, #1e3a8a, #090d16, #000000);
            background-size: 400% 400%;
            animation: waveBackground 12s ease infinite;
            margin: 0; 
            padding: 20px 0; 
            direction: ltr; 
            color: #f8fafc;
            min-height: 100vh;
        }

        @keyframes waveBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { 
            max-width: 480px; 
            margin: auto; 
            padding: 0 15px; 
        }

        /* عنوان الموقع BITE كبير، عريض ومميز */
        .site-title {
            text-align: center;
            color: #ffffff;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 4px 15px rgba(37, 99, 235, 0.5);
            text-transform: uppercase;
        }

        /* صندوق البحث بتصميم زجاجي داكن وعصري */
        .search-box-wrapper {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .search-box-wrapper input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
            background: transparent;
            text-align: left;
            color: #ffffff;
        }
        .search-box-wrapper input::placeholder {
            color: #94a3b8;
        }

        /* بطاقة المطعم بتصميم داكن وعائم */
        .restaurant-card { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(12px);
            margin-bottom: 15px; 
            padding: 18px; 
            border-radius: 16px; 
            cursor: pointer; 
            text-align: left; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
        }
        .restaurant-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border-color: rgba(59, 130, 246, 0.6);
        }

        .restaurant-info h3 {
            margin: 0 0 6px 0;
            font-size: 19px;
            color: #ffffff;
        }
        .restaurant-info p {
            margin: 0;
            font-size: 14px;
            color: #94a3b8;
        }

        /* تفاصيل المينيو وزر الاتصال */
        .details { 
            display: none; 
            margin-top: 15px; 
            border-top: 1px solid rgba(255, 255, 255, 0.1); 
            padding-top: 14px; 
            text-align: left; 
        }
        .menu-img { 
            width: 100%; 
            border-radius: 12px; 
            margin-top: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .phone-btn { 
            display: block; 
            text-align: center; 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); 
            color: white; 
            padding: 13px; 
            border-radius: 12px; 
            text-decoration: none; 
            margin-top: 14px; 
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
            transition: opacity 0.2s;
        }
        .phone-btn:hover { opacity: 0.9; }
        
        .no-result { 
            text-align: center; 
            color: #94a3b8; 
            font-size: 15px; 
            margin-top: 30px; 
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="site-title">BITE</div>

    <!-- صندوق البحث -->
    <div class="search-box-wrapper">
        <span style="margin-left: 10px; font-size: 18px;">🔍</span>
        <input type="text" id="wilayaInput" placeholder="Entrez votre Wilaya (ex: Constantine)..." oninput="searchRestaurants()">
    </div>

    <!-- نتائج البحث -->
    <div id="resultsContainer"></div>
</div>

<script>
    // قاعدة البيانات (أضف مطاعمك هنا)
    const database = [
        {
            "name": "Restaurant Les Grillades d'Or",
            "wilaya": "Constantine",
            "phone": "0600112233",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        }
    ];

    function searchRestaurants() {
        let query = document.getElementById("wilayaInput").value.trim().toLowerCase();
        let container = document.getElementById("resultsContainer");
        container.innerHTML = "";

        if (query === "") {
            return;
        }

        let filtered = database.filter(r => r.wilaya.toLowerCase().includes(query));

        if (filtered.length === 0) {
            container.innerHTML = "<p class='no-result'>Aucun restaurant trouvé pour cette wilaya.</p>";
            return;
        }

        filtered.forEach((rest) => {
            let card = document.createElement("div");
            card.className = "restaurant-card";
            
            card.innerHTML = `
                <div class="restaurant-info">
                    <h3>🍽️ ${rest.name}</h3>
                    <p>📍 Wilaya : <strong>${rest.wilaya}</strong></p>
                </div>
            `;
            
            let details = document.createElement("div");
            details.className = "details";
            
            details.innerHTML = `
                <p style="margin: 0 0 8px 0; font-weight: 600; font-size: 14px; color: #e2e8f0;">Menu du Restaurant :</p>
                <img src="${rest.menuImage}" alt="Menu de ${rest.name}" class="menu-img">
                <a href="tel:${rest.phone}" class="phone-btn">📞 Appeler pour commander : ${rest.phone}</a>
            `;

            card.onclick = function() {
                if(details.style.display === "block") {
                    details.style.display = "none";
                } else {
                    details.style.display = "block";
                }
            };

            card.appendChild(details);
            container.appendChild(card);
        });
    }
</script>

</body>
</html>
