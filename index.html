<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق Appwrite مع GitHub</title>
    <!-- استيراد Tailwind CSS للتصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استيراد مكتبة Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- الهيدر -->
    <header class="p-6 border-b border-slate-800 flex justify-between items-center max-w-4xl mx-auto w-full">
        <h1 class="text-xl font-bold text-red-500">Appwrite & GitHub 🚀</h1>
        <div id="connection-status" class="text-sm px-3 py-1 rounded-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">
            جاري التحقق من الاتصال...
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl text-center">
            <h2 class="text-2xl font-bold mb-4">مرحباً بك في مشروعك الجديد</h2>
            <p class="text-slate-400 text-sm mb-6">
                هذه الصفحة مرتبطة بـ Appwrite وجاهزة للنشر التلقائي عبر مستودع GitHub الخاص بك.
            </p>
            
            <div id="project-info" class="bg-slate-900 p-4 rounded-xl text-right text-xs text-slate-300 space-y-2 mb-6 border border-slate-800">
                <p><strong>Endpoint:</strong> <span id="lbl-endpoint" class="text-red-400">-</span></p>
                <p><strong>Project ID:</strong> <span id="lbl-project" class="text-red-400">-</span></p>
            </div>

            <button onclick="testAppwriteConnection()" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200">
                اختبار الاتصال بـ Appwrite
            </button>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="p-4 text-center text-slate-500 text-xs border-t border-slate-800">
        تم النشر تلقائياً عبر GitHub &bull; Appwrite Integration
    </footer>

    <!-- سكربت الاتصال بـ Appwrite -->
    <script>
        // ضع بيانات مشروعك هنا بعد إنشائه في لوحة التحكم
        const APPWRITE_ENDPOINT = 'https://cloud.appwrite.io/v1';
        const APPWRITE_PROJECT_ID = 'ضع_معرف_المشروع_هنا'; // استبدله بـ Project ID الخاص بك

        // تهيئة SDK
        const { Client, Account } = Appwrite;
        const client = new Client();

        client
            .setEndpoint(APPWRITE_ENDPOINT)
            .setProject(APPWRITE_PROJECT_ID);

        // تحديث النصوص في الواجهة
        document.getElementById('lbl-endpoint').innerText = APPWRITE_ENDPOINT;
        document.getElementById('lbl-project').innerText = APPWRITE_PROJECT_ID;

        // التحقق التلقائي عند التحميل
        window.addEventListener('DOMContentLoaded', () => {
            const statusBadge = document.getElementById('connection-status');
            if (APPWRITE_PROJECT_ID === 'ضع_معرف_المشروع_هنا') {
                statusBadge.className = "text-sm px-3 py-1 rounded-full bg-red-500/10 text-red-400 border border-red-500/20";
                statusBadge.innerText = "يرجى وضع Project ID";
            } else {
                statusBadge.className = "text-sm px-3 py-1 rounded-full bg-green-500/10 text-green-400 border border-green-500/20";
                statusBadge.innerText = "متصل بـ Appwrite بنجاح";
            }
        });

        // دالة لاختبار الاتصال بشكل متقدم
        function testAppwriteConnection() {
            const account = new Account(client);
            account.get().then(
                response => {
                    alert('تم الاتصال بنجاح! المستخدم الحالي مسجل دخول.');
                    console.log(response);
                },
                error => {
                    // إذا لم يكن هناك مستخدم مسجل دخول، سيظهر هذا الخطأ الطبيعي
                    alert('الاتصال يعمل بنجاح! (لا يوجد مستخدم مسجل حالياً)');
                    console.log("Appwrite Ready:", error);
                }
            );
        }
    </script>
</body>
</html>
