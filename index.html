<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITE - الدليل الرقمي للمطاعم والحلويات</title>
    <style>
        :root {
            --primary-color: #ff4757;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2f3640;
            --gray-text: #718093;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            color: var(--gray-text);
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .search-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-filters input, .search-filters select {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background: var(--card-bg);
        }

        .search-filters input:focus, .search-filters select:focus {
            border-color: var(--primary-color);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
        }

        .card-img-container {
            width: 100%;
            height: 180px;
            background: #dfe4ea;
            position: relative;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 20px;
        }

        .card-content {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .card-info {
            font-size: 14px;
            color: var(--gray-text);
            margin-bottom: 12px;
        }

        .menu-slider-container {
            margin-top: 10px;
            border-top: 1px solid #f1f2f6;
            padding-top: 10px;
        }

        .menu-slider-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 10px;
            scrollbar-width: none;
            padding-bottom: 5px;
        }

        .slider::-webkit-scrollbar {
            display: none;
        }

        .slider img {
            width: 90px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            scroll-snap-align: start;
            flex-shrink: 0;
            background: #eee;
            border: 1px solid #eee;
        }

        .card-footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .phone-btn {
            background-color: #2ed573;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .phone-btn:hover {
            background-color: #26af5f;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--gray-text);
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header>
        <h1>BITE</h1>
        <p>دليلك الأول للمطاعم، الحلويات، والمشاريع المنزلية في الجزائر</p>
    </header>

    <div class="container">
        <!-- شريط البحث والتصفية -->
        <div class="search-filters">
            <input type="text" id="searchInput" placeholder="ابحث باسم المطعم أو الأكل..." oninput="filterData()">
            
            <select id="wilayaFilter" onchange="filterData()">
                <option value="">كل الولايات الكبرى</option>
                <option value="الجزائر العاصمة">الجزائر العاصمة</option>
                <option value="وهران">وهران</option>
                <option value="قسنطينة">قسنطينة</option>
                <option value="سطيف">سطيف</option>
                <option value="سكيكدة">سكيكدة</option>
                <option value="البليدة">البليدة</option>
                <option value="تيزي وزو">تيزي وزو</option>
                <option value="عنابة">عنابة</option>
                <option value="باتنة">باتنة</option>
                <option value="تلمسان">تلمسان</option>
                <option value="الجلفة">الجلفة</option>
            </select>

            <select id="categoryFilter" onchange="filterData()">
                <option value="">جميع التصنيفات</option>
                <option value="مطعم">مطعم</option>
                <option value="حلويات">حلويات وباتيسري</option>
                <option value="مشاريع منزلية">مشاريع منزلية</option>
            </select>
        </div>

        <div class="grid-cards" id="cardsContainer"></div>
    </div>

    <!-- استدعاء ملفات الولايات -->
    <script src="alger.js"></script>
    <script src="oran.js"></script>
    <script src="constantine.js"></script>
    <script src="setif.js"></script>
    <script src="skikda.js"></script>
    <script src="blida.js"></script>
    <script src="tiziouzou.js"></script>
    <script src="annaba.js"></script>
    <script src="batna.js"></script>
    <script src="tlemcen.js"></script>
    <script src="djelfa.js"></script>

    <!-- ملف التجميع والمنطق البرمجي -->
    <script>
        const database = [
            ...(typeof algerData !== 'undefined' ? algerData : []),
            ...(typeof oranData !== 'undefined' ? oranData : []),
            ...(typeof constantineData !== 'undefined' ? constantineData : []),
            ...(typeof setifData !== 'undefined' ? setifData : []),
            ...(typeof skikdaData !== 'undefined' ? skikdaData : []),
            ...(typeof blidaData !== 'undefined' ? blidaData : []),
            ...(typeof tiziouzouData !== 'undefined' ? tiziouzouData : []),
            ...(typeof annabaData !== 'undefined' ? annabaData : []),
            ...(typeof batnaData !== 'undefined' ? batnaData : []),
            ...(typeof tlemcenData !== 'undefined' ? tlemcenData : []),
            ...(typeof djelfaData !== 'undefined' ? djelfaData : [])
        ];

        function renderCards(dataToDisplay) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            if (dataToDisplay.length === 0) {
                container.innerHTML = `<div class="no-results">عذراً، لم نجد أي نتيجة تطابق بحثك.</div>`;
                return;
            }

            dataToDisplay.forEach(item => {
                let menuImagesHTML = '';
                if (item.menus && item.menus.length > 0) {
                    let imagesTags = item.menus.map(img => `<img src="${img}" loading="lazy" alt="صفحة منيو">`).join('');
                    menuImagesHTML = `
                        <div class="menu-slider-container">
                            <div class="menu-slider-title">صفحات المنيو (${item.menus.length} صفحات):</div>
                            <div class="slider">
                                ${imagesTags}
                            </div>
                        </div>
                    `;
                }

                const cardHTML = `
                    <div class="card">
                        <div class="card-img-container">
                            <img src="${item.profileImg}" loading="lazy" alt="${item.name}">
                            <span class="badge">${item.category}</span>
                        </div>
                        <div class="card-content">
                            <div>
                                <div class="card-title">${item.name}</div>
                                <div class="card-info">📍 ${item.wilaya}</div>
                            </div>
                            
                            ${menuImagesHTML}

                            <div class="card-footer">
                                <a href="tel:${item.phone}" class="phone-btn">📞 اتصل: ${item.phone}</a>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function filterData() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const selectedWilaya = document.getElementById('wilayaFilter').value;
            const selectedCategory = document.getElementById('categoryFilter').value;

            const filtered = database.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchText);
                const matchesWilaya = selectedWilaya === "" || item.wilaya === selectedWilaya;
                const matchesCategory = selectedCategory === "" || item.category === selectedCategory;

                return matchesSearch && matchesWilaya && matchesCategory;
            });

            renderCards(filtered);
        }

        window.onload = function() {
            renderCards(database);
        };
    </script>
</body>
</html>
