<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DzDelivery - Annuaire des Restaurants</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            /* خلفية عصرية بتموجات تدرج لونية (Gradients) متناسقة وجذابة */
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 50%, #ff512f 100%);
            background-attachment: fixed;
            margin: 0; 
            padding: 20px 0; 
            direction: ltr; 
            color: #333;
            min-height: 100vh;
        }

        .container { 
            max-width: 480px; 
            margin: auto; 
            padding: 0 15px; 
        }

        /* عنوان الموقع الأنيق */
        .site-title {
            text-align: center;
            color: white;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        /* صندوق البحث العصري (زجاجي خفيف أو أبيض ناصع مع ظل قوي) */
        .search-box-wrapper {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 14px 18px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .search-box-wrapper input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
            background: transparent;
            text-align: left;
            color: #333;
        }

        /* بطاقة المطعم بتصميم نظيف وعائم */
        .restaurant-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            margin-bottom: 15px; 
            padding: 18px; 
            border-radius: 16px; 
            cursor: pointer; 
            text-align: left; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .restaurant-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }

        .restaurant-info h3 {
            margin: 0 0 6px 0;
            font-size: 19px;
            color: #111;
        }
        .restaurant-info p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }

        /* تفاصيل المينيو وزر الاتصال */
        .details { 
            display: none; 
            margin-top: 15px; 
            border-top: 1px solid #eee; 
            padding-top: 14px; 
            text-align: left; 
        }
        .menu-img { 
            width: 100%; 
            border-radius: 12px; 
            margin-top: 10px; 
            border: 1px solid #ddd; 
        }
        .phone-btn { 
            display: block; 
            text-align: center; 
            background: linear-gradient(135deg, #ff512f 0%, #f09819 100%); 
            color: white; 
            padding: 13px; 
            border-radius: 12px; 
            text-decoration: none; 
            margin-top: 14px; 
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(255, 81, 47, 0.4);
            transition: opacity 0.2s;
        }
        .phone-btn:hover { opacity: 0.9; }
        
        .no-result { 
            text-align: center; 
            color: white; 
            font-size: 15px; 
            margin-top: 30px; 
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="site-title">🍔 Food Delivery DZ</div>

    <!-- صندوق البحث -->
    <div class="search-box-wrapper">
        <span style="margin-left: 10px; font-size: 18px;">🔍</span>
        <input type="text" id="wilayaInput" placeholder="Entrez votre Wilaya (ex: Constantine)..." oninput="searchRestaurants()">
    </div>

    <!-- نتائج البحث -->
    <div id="resultsContainer"></div>
</div>

<script>
    // قاعدة البيانات (أضف مطاعمك هنا)
    const database = [
        {
            "name": "Restaurant Les Grillades d'Or",
            "wilaya": "Constantine",
            "phone": "0600112233",
            "menuImage": "https://i.imgur.com/ggFDFrb.jpeg"
        }
    ];

    function searchRestaurants() {
        let query = document.getElementById("wilayaInput").value.trim().toLowerCase();
        let container = document.getElementById("resultsContainer");
        container.innerHTML = "";

        if (query === "") {
            return;
        }

        let filtered = database.filter(r => r.wilaya.toLowerCase().includes(query));

        if (filtered.length === 0) {
            container.innerHTML = "<p class='no-result'>Aucun restaurant trouvé pour cette wilaya.</p>";
            return;
        }

        filtered.forEach((rest) => {
            let card = document.createElement("div");
            card.className = "restaurant-card";
            
            card.innerHTML = `
                <div class="restaurant-info">
                    <h3>🍽️ ${rest.name}</h3>
                    <p>📍 Wilaya : <strong>${rest.wilaya}</strong></p>
                </div>
            `;
            
            let details = document.createElement("div");
            details.className = "details";
            
            details.innerHTML = `
                <p style="margin: 0 0 8px 0; font-weight: 600; font-size: 14px; color: #444;">Menu du Restaurant :</p>
                <img src="${rest.menuImage}" alt="Menu de ${rest.name}" class="menu-img">
                <a href="tel:${rest.phone}" class="phone-btn">📞 Appeler pour commander : ${rest.phone}</a>
            `;

            card.onclick = function() {
                if(details.style.display === "block") {
                    details.style.display = "none";
                } else {
                    details.style.display = "block";
                }
            };

            card.appendChild(details);
            container.appendChild(card);
        });
    }
</script>

</body>
</html>
